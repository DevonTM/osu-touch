<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="data:,">
  <title>osu-touch</title>
  <script>
    try {
      if (sessionStorage.getItem('osuTouchPin')) document.documentElement.classList.add('has-stored-pin');
    } catch (_) {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.18);
      --text: #f8fbff;
      --muted: #94a3b8;
      --ok: #47ff9a;
      --bad: #ffb020;
      --danger: #ff5570;
    }

    * { box-sizing: border-box; }

    .pin-gate ::selection,
    header ::selection,
    footer ::selection {
      background: rgba(71, 255, 154, 0.35);
      color: var(--text);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Avenir Next", Verdana, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .surface {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(18px, 3vw, 24px);
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.26), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(255, 55, 95, 0.24), transparent 32%),
        linear-gradient(135deg, #05070a 0%, #101827 52%, #090b10 100%);
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 8vw, 64px);
      letter-spacing: -0.08em;
      line-height: 0.9;
    }

    .status {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
    }

    .status.connected { color: var(--ok); }
    .status.connecting { color: var(--muted); }
    .status.disconnected { color: var(--bad); }

    .locked .pad,
    .locked footer {
      filter: blur(10px);
      opacity: 0.22;
    }

    .has-stored-pin .locked .pad,
    .has-stored-pin .locked footer {
      filter: none;
      opacity: 1;
    }

    .pin-gate {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 7, 10, 0.62);
      backdrop-filter: blur(12px);
    }

    .pin-gate[hidden] { display: none; }

    .has-stored-pin .pin-gate { display: none; }

    .pin-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(8, 13, 22, 0.88);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      display: grid;
      gap: 14px;
    }

    .pin-card h2 {
      margin: 0;
      font-size: clamp(28px, 8vw, 44px);
      letter-spacing: -0.07em;
      line-height: 0.95;
    }

    .pin-card p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.4;
    }

    .pin-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .pin-row input,
    .pin-row button {
      min-height: 54px;
      border-radius: 16px;
      font: inherit;
      font-weight: 900;
    }

    .pin-row input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      text-align: center;
      letter-spacing: 0.22em;
      font-size: 24px;
    }

    .pin-row input::selection {
      background: rgba(71, 255, 154, 0.42);
      color: #06110a;
    }

    .pin-row button {
      border: 0;
      padding: 0 18px;
      background: var(--ok);
      color: #06110a;
      cursor: pointer;
      transition: transform 90ms linear, background 120ms linear, box-shadow 120ms linear;
    }

    /* Avoid sticky :hover highlight on touch phones after tap. */
    @media (hover: hover) and (pointer: fine) {
      .pin-row button:hover {
        background: #7dffb9;
        color: #03140a;
        box-shadow: 0 0 28px rgba(71, 255, 154, 0.26);
      }
    }

    .pin-row button:active {
      transform: translateY(1px) scale(0.98);
      background: #2eea82;
      color: #03140a;
    }

    .pin-error {
      min-height: 18px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pad {
      align-self: stretch;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.035), 0 12px 34px rgba(0, 0, 0, 0.26);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    .pad-label {
      pointer-events: none;
      color: var(--muted);
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hint {
      color: var(--muted);
      font-weight: 700;
      line-height: 1.35;
      min-width: 0;
    }

    .version {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .controls {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      box-sizing: border-box;
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 90ms linear, background 120ms linear, color 120ms linear, opacity 120ms linear;
    }

    .control-btn svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Both icons stay in layout; only one is visible. Size never changes on toggle. */
    .control-btn .icon {
      grid-area: 1 / 1;
    }

    .control-btn .icon[data-when="on"],
    .control-btn .icon[data-when="off"] {
      visibility: hidden;
    }

    .control-btn[aria-pressed="true"] .icon[data-when="on"],
    .control-btn[aria-pressed="false"] .icon[data-when="off"] {
      visibility: visible;
    }

    /* Avoid sticky :hover highlight on touch phones after tap. */
    @media (hover: hover) and (pointer: fine) {
      .control-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
    }

    .control-btn:active {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(1px) scale(0.98);
    }

    .control-btn[aria-pressed="false"] {
      color: var(--muted);
      opacity: 0.72;
    }

    @media (max-width: 640px) {
      footer {
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .pad { border-radius: 24px; }
      .hint { font-size: 13px; flex: 1 1 180px; }
      .controls { margin-left: auto; }
      .pin-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="surface locked" id="surface" draggable="false">
    <header>
      <h1>osu! touch</h1>
      <div id="connection" class="status disconnected">disconnected</div>
      <script>
        try {
          if (document.documentElement.classList.contains('has-stored-pin')) {
            const el = document.getElementById('connection');
            el.textContent = 'connecting';
            el.className = 'status connecting';
          }
        } catch (_) {}
      </script>
    </header>

    <section id="tapPad" class="pad" aria-label="Tap zone">
      <span class="pad-label">Tap here</span>
    </section>

    <footer>
      <div class="hint">
        Each new touch alternates {{.Key1}} / {{.Key2}}
        <br>
        Release the active touch to release the key
        <span class="version">{{.AppName}} version {{.AppVersion}}</span>
      </div>
      <div class="controls">
        <button type="button" id="soundToggle" class="control-btn" aria-pressed="true" aria-label="Tap sound on">
          <span class="icon" data-when="on" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 9v6h3.2L12 19V5L7.2 9H4z" fill="currentColor" stroke="none"></path>
              <path d="M15.2 8.4a4.2 4.2 0 0 1 0 7.2"></path>
              <path d="M17.6 5.8a7.2 7.2 0 0 1 0 12.4"></path>
            </svg>
          </span>
          <span class="icon" data-when="off" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 9v6h3.2L12 19V5L7.2 9H4z" fill="currentColor" stroke="none"></path>
              <path d="M16 9.5l4 5"></path>
              <path d="M20 9.5l-4 5"></path>
            </svg>
          </span>
        </button>
      </div>
    </footer>

  </main>

  <section class="pin-gate" id="pinGate" aria-label="Pairing PIN">
    <form class="pin-card" id="pinForm" autocomplete="off" novalidate>
      <h2>Enter pairing PIN</h2>
      <p>Use the 6 digit PIN shown in the osu-touch console.</p>
      <div class="pin-row">
        <input id="pinInput" name="pin" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="Pairing PIN">
        <button type="submit">Unlock</button>
      </div>
      <div class="pin-error" id="pinError" role="alert"></div>
    </form>
  </section>

  <script>
    (() => {
      const surface = document.getElementById('surface');
      const pad = document.getElementById('tapPad');
      const connection = document.getElementById('connection');
      // Prevent same-frame multi-touch bursts from producing 1ms Z/X/Z taps.
      const simultaneousGuardMs = 10;
      const connectTimeoutMs = 3000;
      const checkingMinMs = 500;
      const startupConnectingMinMs = 500;
      const heldPointers = new Set();
      let socket = null;
      let lastSentMask = -1;
      let currentMask = 0;
      let reconnectTimer = 0;
      let activePointer = null;
      let nextMask = 1;
      let idleBurstStartedAt = 0;
      let audioCtx = null;
      let clickBuffer = null;
      const AudioCtx = window.AudioContext || window.webkitAudioContext || null;
      const soundStorageKey = 'osuTouchSound';
      let soundEnabled = true;
      try {
        soundEnabled = localStorage.getItem(soundStorageKey) !== '0';
      } catch (_) {}
      let pairingPin = sessionStorage.getItem('osuTouchPin') || '';
      let unlocked = false;
      let submittingPin = false;
      let startupReconnectPending = /^\d{6}$/.test(pairingPin);
      const startupReconnectStartedAt = performance.now();

      const pinGate = document.getElementById('pinGate');
      const pinForm = document.getElementById('pinForm');
      const pinInput = document.getElementById('pinInput');
      const pinError = document.getElementById('pinError');
      const soundToggle = document.getElementById('soundToggle');

      function syncSoundToggle() {
        soundToggle.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
        soundToggle.setAttribute('aria-label', soundEnabled ? 'Tap sound on' : 'Tap sound off');
      }

      function setSoundEnabled(enabled) {
        soundEnabled = !!enabled;
        try {
          localStorage.setItem(soundStorageKey, soundEnabled ? '1' : '0');
        } catch (_) {}
        syncSoundToggle();
        if (soundEnabled) ensureAudio();
      }

      function buildClickBuffer(ctx) {
        // Pre-render one short mechanical key clack so every tap has the same waveform.
        // Low body keeps it key-like; mid-high transient helps it cut through game music.
        const duration = 0.038;
        const sampleRate = ctx.sampleRate;
        const frameCount = Math.max(1, Math.floor(sampleRate * duration));
        const buffer = ctx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);
        // Deterministic noise so reloads keep the same click character.
        let seed = 0x1a2b3c4d;
        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          // Soft body thump + louder mid/high shell attack.
          const bodyEnv = Math.exp(-t * 60);
          const clackEnv = Math.exp(-t * 260);
          const attackEnv = Math.exp(-t * 520);
          const body = Math.sin(2 * Math.PI * 170 * t) * 0.48 + Math.sin(2 * Math.PI * 300 * t) * 0.24;
          const clack = Math.sin(2 * Math.PI * 1100 * t) * 0.34 + Math.sin(2 * Math.PI * 1750 * t) * 0.22;
          const attack = Math.sin(2 * Math.PI * 2400 * t) * 0.18;
          seed = (seed * 1664525 + 1013904223) >>> 0;
          const noise = ((seed / 0xffffffff) * 2 - 1) * Math.exp(-t * 340) * 0.58;
          // Soft clip so the punch stays loud without nasty hard distortion.
          const sample = body * bodyEnv + clack * clackEnv + attack * attackEnv + noise;
          data[i] = Math.tanh(sample * 1.35);
        }
        return buffer;
      }

      function ensureAudio() {
        if (!AudioCtx) return null;
        if (!audioCtx) {
          audioCtx = new AudioCtx();
          clickBuffer = buildClickBuffer(audioCtx);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }

      function playTapClick() {
        if (!soundEnabled) return;
        const ctx = ensureAudio();
        if (!ctx || !clickBuffer) return;

        const play = () => {
          if (ctx.state !== 'running') return;
          const source = ctx.createBufferSource();
          const gain = ctx.createGain();
          source.buffer = clickBuffer;
          // Keep playback hot so the clack remains audible over game music.
          gain.gain.value = 1.45;
          source.connect(gain);
          gain.connect(ctx.destination);
          source.start(0);
        };

        if (ctx.state === 'running') {
          play();
          return;
        }
        // First gesture may still be unlocking AudioContext; play once resume settles.
        ctx.resume().then(play).catch(() => {});
      }

      function setLocked(locked, message = '') {
        unlocked = !locked;
        document.documentElement.classList.remove('has-stored-pin');
        surface.classList.toggle('locked', locked);
        pinGate.hidden = !locked;
        pinError.textContent = message;
        if (locked) {
          startupReconnectPending = false;
          setConnectionState('disconnected');
          clearTouches();
          requestAnimationFrame(() => pinInput.focus());
        }
      }

      function setConnectionState(state) {
        connection.textContent = state;
        connection.classList.toggle('connected', state === 'connected');
        connection.classList.toggle('connecting', state === 'connecting');
        connection.classList.toggle('disconnected', state === 'disconnected');
      }

      function sendMask(mask, force = false) {
        currentMask = mask & 3;
        if (!force && currentMask === lastSentMask) return;
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(new Uint8Array([currentMask]));
        lastSentMask = currentMask;
      }

      function clearTouches() {
        heldPointers.clear();
        activePointer = null;
        idleBurstStartedAt = 0;
        sendMask(0, true);
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function waitForMinimum(startedAt, durationMs) {
        return wait(Math.max(0, durationMs - (performance.now() - startedAt)));
      }

      async function checkPairingPin(pin) {
        try {
          const response = await fetch(`/auth?pin=${encodeURIComponent(pin)}`, { cache: 'no-store' });
          if (response.status === 204) return 'valid';
          if (response.status === 401) return 'invalid';
          return 'unreachable';
        } catch (_) {
          return 'unreachable';
        }
      }

      function expireSession(message) {
        sessionStorage.removeItem('osuTouchPin');
        pairingPin = '';
        setLocked(true, message);
      }

      function connect(manual = false) {
        clearTimeout(reconnectTimer);
        if (!/^\d{6}$/.test(pairingPin)) {
          setLocked(true);
          return;
        }
        let opened = false;
        let timedOut = false;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/ws?pin=${encodeURIComponent(pairingPin)}`);
        socket.binaryType = 'arraybuffer';
        const connectTimeout = setTimeout(() => {
          if (socket.readyState !== WebSocket.CONNECTING) return;
          timedOut = true;
          socket.close();
        }, connectTimeoutMs);

        socket.addEventListener('open', async () => {
          clearTimeout(connectTimeout);
          opened = true;
          setLocked(false);
          pinInput.value = '';
          pinError.textContent = '';
          submittingPin = false;
          if (startupReconnectPending) {
            await waitForMinimum(startupReconnectStartedAt, startupConnectingMinMs);
            startupReconnectPending = false;
          }
          setConnectionState('connected');
          lastSentMask = -1;
          sendMask(currentMask, true);
        });

        socket.addEventListener('close', (event) => {
          clearTimeout(connectTimeout);
          if (!startupReconnectPending) setConnectionState('disconnected');
          if (!opened && !timedOut && event.code === 1006) {
            checkPairingPin(pairingPin).then((result) => {
              if (result === 'invalid') {
                expireSession(manual ? 'Invalid PIN' : 'Session expired');
                return;
              }
              reconnectTimer = setTimeout(connect, 600);
            });
            return;
          }
          reconnectTimer = setTimeout(connect, 600);
        });

        socket.addEventListener('error', () => {
          if (!startupReconnectPending) setConnectionState('disconnected');
          socket.close();
        });
      }

      pinInput.addEventListener('input', () => {
        pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
        pinError.textContent = '';
      });

      pinForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submittingPin) return;
        const value = pinInput.value.trim();
        if (!/^\d{6}$/.test(value)) {
          pinError.textContent = 'Enter exactly 6 digits';
          return;
        }
        if (soundEnabled) ensureAudio();
        submittingPin = true;
        const checkingStartedAt = performance.now();
        pinError.textContent = 'Checking...';
        const result = await checkPairingPin(value);
        await waitForMinimum(checkingStartedAt, checkingMinMs);
        if (result === 'invalid') {
          pinError.textContent = 'Invalid PIN';
          submittingPin = false;
          return;
        }
        if (result === 'unreachable') {
          pinError.textContent = 'Connection failed';
          submittingPin = false;
          return;
        }
        pairingPin = value;
        sessionStorage.setItem('osuTouchPin', value);
        pinError.textContent = 'Connecting...';
        setConnectionState('connecting');
        connect(true);
      });

      soundToggle.addEventListener('click', (event) => {
        event.preventDefault();
        setSoundEnabled(!soundEnabled);
      });
      syncSoundToggle();

      pad.addEventListener('pointerdown', (event) => {
        if (!unlocked) return;
        if (event.pointerType !== 'touch' && event.pointerType !== 'mouse') return;
        event.preventDefault();
        // preventDefault keeps focus/selection from updating; clear them manually.
        const selection = window.getSelection?.();
        if (selection && selection.rangeCount) selection.removeAllRanges();
        const active = document.activeElement;
        if (active && active !== document.body && active !== document.documentElement && typeof active.blur === 'function') {
          active.blur();
        }
        if (heldPointers.has(event.pointerId)) return;
        const now = performance.now();
        const wasIdle = heldPointers.size === 0;
        navigator.vibrate?.(0);
        heldPointers.add(event.pointerId);

        if (wasIdle) {
          idleBurstStartedAt = now;
        } else if (now - idleBurstStartedAt <= simultaneousGuardMs) {
          return;
        }

        activePointer = event.pointerId;
        playTapClick();
        sendMask(nextMask);
        nextMask = nextMask === 1 ? 2 : 1;
      });

      pad.addEventListener('pointermove', (event) => {
        if (!unlocked) return;
        if (heldPointers.has(event.pointerId)) event.preventDefault();
      });

      function releasePointer(event) {
        if (!unlocked) return;
        event.preventDefault();
        if (!heldPointers.delete(event.pointerId)) return;
        if (heldPointers.size === 0) idleBurstStartedAt = 0;
        if (activePointer !== event.pointerId) return;
        activePointer = null;
        sendMask(0);
      }

      pad.addEventListener('pointerup', releasePointer);
      pad.addEventListener('pointercancel', releasePointer);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearTouches();
      });
      window.addEventListener('blur', clearTouches);
      window.addEventListener('pagehide', clearTouches);
      window.addEventListener('beforeunload', clearTouches);
      const blockBrowserGesture = (event) => {
        if (unlocked) event.preventDefault();
      };
      const nonPassive = { passive: false };

      pad.addEventListener('contextmenu', blockBrowserGesture);
      pad.addEventListener('selectstart', blockBrowserGesture);
      pad.addEventListener('dragstart', blockBrowserGesture);
      pad.addEventListener('gesturestart', blockBrowserGesture, nonPassive);
      pad.addEventListener('touchstart', blockBrowserGesture, nonPassive);
      pad.addEventListener('touchmove', blockBrowserGesture, nonPassive);
      pad.addEventListener('touchend', blockBrowserGesture, nonPassive);
      pad.addEventListener('touchcancel', blockBrowserGesture, nonPassive);

      connect();
    })();
  </script>
</body>
</html>
